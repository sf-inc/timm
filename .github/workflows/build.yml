# Builds the mod on every push and pull request, and uploads the resulting jars as a workflow artifact.

name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: build
        run: gradle build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  client_game_test:
    # Starts the game with the mod and runs the client game tests (src/gametest)
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'
      - name: install software rendering drivers
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: run client game tests
        run: gradle runClientGameTest
        env:
          # The runner has no sound card: OpenAL plays to a null device, so that the music can start
          ALSOFT_DRIVERS: 'null'
      - name: capture logs and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Client game test
          path: |
            build/run/clientGameTest/logs/
            build/run/clientGameTest/screenshots/
